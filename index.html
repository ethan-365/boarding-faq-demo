<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boarding FAQ</title>
<style>
  :root { --navy:#17324d; --ink:#2b3d4f; --muted:#6b7c8c; --sky:#e6f2fb; --line:#c9dcec; --accent:#f08c00; --white:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:var(--white); line-height:1.55; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; font-weight:600; color:var(--navy); margin:0 0 4px; }
  .lede { margin:0 0 16px; color:var(--muted); }
  .urgent { border:1px solid #f3c27a; border-left:4px solid var(--accent); background:#fff7ea; padding:10px 14px; margin:0 0 18px; color:#5c3a00; }
  .urgent a { color:#5c3a00; font-weight:600; }
  .search input { width:100%; font:inherit; font-size:1.15rem; padding:16px 18px; border:2px solid var(--line); border-radius:10px; color:var(--navy); }
  .search input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(240,140,0,.18); }
  .status { font-size:.85rem; color:var(--muted); margin:8px 2px 0; min-height:1.3em; }
  .status::before { content:"●"; margin-right:6px; }
  .status.ready::before { color:#2e9d5b; } .status.loading::before { color:var(--accent); } .status.basic::before { color:var(--muted); } .status.error::before { color:#c0392b; }
  .results { margin-top:20px; }
  .card { border:1px solid var(--line); border-left:4px solid var(--accent); padding:16px 18px; margin-bottom:12px; }
  .card h3 { margin:0 0 6px; font-size:1.05rem; color:var(--navy); font-weight:600; }
  .card p { margin:0 0 8px; }
  .meta { font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 16px; }
  .meta a { color:var(--navy); }
  .score { font-size:.75rem; color:var(--muted); float:right; }
  .panel { background:var(--sky); border-radius:10px; padding:20px; }
  .panel h3 { margin:0 0 6px; color:var(--navy); }
  .panel p { margin:0 0 8px; }
  .suggest { background:var(--white); border:1px solid var(--line); border-radius:8px; margin:10px 0 14px; }
  .suggest summary { padding:12px 14px; }
  .suggest > div { padding:0 14px 12px; }
  .btn { display:inline-block; background:var(--navy); color:var(--white); text-decoration:none; padding:10px 16px; border-radius:8px; font-weight:600; }
  .btn:hover, .btn:focus-visible { background:#0f2438; outline:2px solid var(--accent); outline-offset:2px; }
  .more { margin-top:4px; font-size:.9rem; color:var(--muted); }
  .more a { color:var(--navy); }
  .topic { margin-top:28px; }
  .topic h2 { font-size:1.1rem; color:var(--navy); margin:0 0 8px; padding-bottom:6px; border-bottom:2px solid var(--sky); }
  details.qa { border-bottom:1px solid var(--sky); }
  summary { cursor:pointer; padding:10px 2px; color:var(--navy); font-weight:500; }
  summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  details.qa > div { padding:0 2px 12px; }
  details p { margin:0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Boarding FAQ</h1>
  <p class="lede">Type your question in your own words. If there’s no good match, you can email the boarding office.</p>
  <div id="urgent"></div>
  <div class="search">
    <label for="q" style="position:absolute;left:-9999px">Search the boarding FAQ</label>
    <input id="q" type="search" placeholder="e.g. Can a boarder go home this weekend?" autocomplete="off">
  </div>
  <div id="status" class="status loading">Loading FAQs…</div>
  <div id="results" class="results"></div>
  <div id="all"></div>
</div>

<script>
/* ===================== SETTINGS ===================== */
const CONFIG = {
  csvFile: "faq.csv",
  contactEmail: "CHANGE-ME@tss.qld.edu.au",   // used when an answer has no contact of its own
  feedbackEmail: "CHANGE-ME@tss.qld.edu.au",  // receives "wrong answer" reports
  emailSubject: "Boarding FAQ question",
  urgent: { text: "Urgent? Call the house parent on duty:", phone: "0400 000 000" }, // set to null to hide
  model: "Xenova/all-MiniLM-L6-v2",
  matchThreshold: 0.40,     // score needed to show an answer (0 to 1)
  nearMissThreshold: 0.28,  // between this and matchThreshold shows "Did you mean…?"
  basicThreshold: 0.5,      // keyword-only mode (if smart search can't load)
  basicNearMiss: 0.3,
  maxResults: 3,
  showScores: false         // true while testing, to tune thresholds
};

// Words people use -> words the FAQ uses. Keys are lower case, singular.
const SYNONYMS = {
  kid:["boarder"], child:["boarder"], children:["boarder"], student:["boarder"], son:["boarder"], daughter:["boarder"], boy:["boarder"], girl:["boarder"],
  internet:["wifi"], "wi-fi":["wifi"], network:["wifi"], online:["wifi"], connection:["wifi"],
  laptop:["device"], computer:["device"], ipad:["device"], macbook:["device"], phone:["device"],
  exeat:["leave"], pass:["leave"], signout:["leave"],
  dinner:["meal"], lunch:["meal"], breakfast:["meal"], food:["meal"], eat:["meal"], hungry:["meal"],
  broken:["maintenance","broken"], broke:["broken"], fix:["maintenance"], repair:["maintenance"], leak:["maintenance"], damage:["broken"],
  bus:["transport"], van:["transport"], minibus:["transport"], car:["transport"], drive:["transport"], lift:["transport"],
  mum:["parent"], dad:["parent"], mom:["parent"], family:["parent"], guardian:["parent"],
  sick:["unwell"], ill:["unwell"],
  homesick:["wellbeing","homesick"], sad:["wellbeing"], lonely:["wellbeing"], upset:["wellbeing"],
  clothe:["laundry"], clothes:["laundry"], wash:["laundry"], uniform:["laundry"],
  missing:["lost"], misplaced:["lost"],
  bed:["lights"], bedtime:["lights"], sleep:["lights"],
  login:["password"], locked:["password"],
  printer:["print"], roster:["duty"], shift:["duty"], swap:["duty"],
  key:["access"], card:["access"], swipe:["access"],
  saturday:["weekend"], sunday:["weekend"],
  visit:["visitor"], visiting:["visitor"]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const $q = $("q"), $status = $("status"), $results = $("results"), $all = $("all");
let FAQ = [], extractor = null, smart = false;

const STOP = new Set("a an the is are am do does did i me my we our you your to of in on at for and or can how what when where who why should with be it this that there their they he she his her them boarder boarders want wants need needs get got please help just".split(" "));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const stem = t => t.length > 5 && t.endsWith("ing") ? t.slice(0,-3) : t.length > 4 && t.endsWith("ed") ? t.slice(0,-2) : t.length > 3 && t.endsWith("s") && !t.endsWith("ss") ? t.slice(0,-1) : t;
const rawTokens = s => s.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(t => t.length > 1);
const expand = t => { const s = stem(t); return [s, ...(SYNONYMS[t] || []), ...(SYNONYMS[s] || [])]; };
const tokenSet = s => { const set = new Set(); rawTokens(s).forEach(t => expand(t).forEach(x => set.add(x))); return set; };
const isStop = t => STOP.has(t) || STOP.has(stem(t)) || ((SYNONYMS[t] || SYNONYMS[stem(t)]) || [null]).every(x => STOP.has(x));
const queryTokens = s => rawTokens(s).filter(t => !isStop(t));

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim()));
  const head = clean.shift().map(h => h.trim().toLowerCase());
  const col = name => head.indexOf(name);
  return clean.map(r => ({
    topic: (r[col("topic")] || "General").trim(),
    q: (r[col("question")] || "").trim(),
    alts: (r[col("alternatives")] || "").split("|").map(s => s.trim()).filter(Boolean),
    a: (r[col("answer")] || "").trim(),
    contact: (r[col("contact")] || "").trim(),
    reviewed: (r[col("last_reviewed")] || "").trim()
  })).filter(e => e.q && e.a);
}

function keywordScore(qTok, e) {
  if (!qTok.length) return 0;
  let score = 0;
  for (const t of qTok) {
    const cands = expand(t);
    const near = (a, b) => Math.min(a.length, b.length) >= 4 && Math.abs(a.length - b.length) <= 3 && (a.startsWith(b) || b.startsWith(a));
    const inSet = set => cands.some(c => set.has(c)) || [...set].some(h => near(cands[0], h));
    if (inSet(e._kw)) score += 1; else if (inSet(e._ans) || inSet(e._topic)) score += 0.5;
  }
  return score / qTok.length;
}

const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
const contactOf = e => e.contact || CONFIG.contactEmail;
const mailto = (to, subject, body) => "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
const askLink = query => mailto(CONFIG.contactEmail, CONFIG.emailSubject, "Hi,\n\nI couldn’t find an answer in the boarding FAQ.\n\nMy question: " + query + "\n\nThanks");
const reportLink = (query, e) => mailto(CONFIG.feedbackEmail, "Boarding FAQ: wrong or outdated answer", "I searched for: " + query + "\nAnswer shown: " + e.q + "\n\nWhat was wrong or missing:\n");

function metaHtml(e, query) {
  return `<div class="meta">
    <span>Contact: <a href="mailto:${esc(contactOf(e))}">${esc(contactOf(e))}</a></span>
    ${e.reviewed ? `<span>Last reviewed: ${esc(e.reviewed)}</span>` : ""}
    ${query != null ? `<a href="${esc(reportLink(query, e))}">Wrong or outdated answer?</a>` : ""}
  </div>`;
}

function renderAll() {
  const topics = [...new Set(FAQ.map(e => e.topic))];
  $all.innerHTML = topics.map(t => `
    <section class="topic"><h2>${esc(t)}</h2>
      ${FAQ.filter(e => e.topic === t).map(e => `
        <details class="qa"><summary>${esc(e.q)}</summary><div><p>${esc(e.a)}</p>${metaHtml(e, e.q)}</div></details>`).join("")}
    </section>`).join("");
}

let seq = 0;
async function search(raw) {
  const query = raw.trim(), mySeq = ++seq;
  if (!query || !FAQ.length) { $results.innerHTML = ""; $all.style.display = ""; return; }
  $all.style.display = "none";

  const qTok = queryTokens(query);
  let qVec = null;
  if (smart) qVec = (await extractor(query, { pooling:"mean", normalize:true })).tolist()[0];
  if (mySeq !== seq) return;

  const scored = FAQ.map(e => {
    const kw = keywordScore(qTok, e);
    let score = kw;
    if (qVec) {
      const semQ = Math.max(...e._vecs.map(v => dot(qVec, v)));
      const semA = e._ansVec ? 0.9 * dot(qVec, e._ansVec) : 0;
      score = 0.75 * Math.max(semQ, semA) + 0.25 * kw;
    }
    return { e, score };
  }).sort((a, b) => b.score - a.score);

  const match = qVec ? CONFIG.matchThreshold : CONFIG.basicThreshold;
  const near = qVec ? CONFIG.nearMissThreshold : CONFIG.basicNearMiss;
  const best = scored[0];
  const sc = s => CONFIG.showScores ? `<span class="score">${s.toFixed(2)}</span>` : "";

  if (best.score >= match) {
    const hits = scored.filter(s => s.score >= match && s.score >= best.score - 0.12).slice(0, CONFIG.maxResults);
    $results.innerHTML = hits.map(({ e, score }) => `
      <article class="card">${sc(score)}<h3>${esc(e.q)}</h3><p>${esc(e.a)}</p>${metaHtml(e, query)}</article>`).join("")
      + `<p class="more">Not what you’re after? <a href="${esc(askLink(query))}">Email your question to the boarding office</a>.</p>`;
    return;
  }

  const suggestions = scored.filter(s => s.score >= near).slice(0, 2);
  $results.innerHTML = `<div class="panel">
    ${suggestions.length ? `<h3>Did you mean…?</h3>
      ${suggestions.map(({ e, score }) => `<details class="suggest"><summary>${esc(e.q)} ${sc(score)}</summary><div><p>${esc(e.a)}</p>${metaHtml(e, query)}</div></details>`).join("")}
      <p>${suggestions.length > 1 ? "If neither of these answers" : "If that doesn’t answer"} your question, send it to the boarding office.</p>`
    : `<h3>No matching answer found</h3><p>Try different wording, or send your question to the boarding office.</p>
      ${CONFIG.showScores ? `<p class="meta">Best: ${best.score.toFixed(2)} (${esc(best.e.q)})</p>` : ""}`}
    <a class="btn" href="${esc(askLink(query))}">Email the boarding office</a>
  </div>`;
}

let timer;
$q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search($q.value), 250); });
$q.addEventListener("keydown", ev => { if (ev.key === "Enter") { clearTimeout(timer); search($q.value); } });

if (CONFIG.urgent) $("urgent").innerHTML = `<div class="urgent">${esc(CONFIG.urgent.text)} <a href="tel:${esc(CONFIG.urgent.phone.replace(/\s/g, ""))}">${esc(CONFIG.urgent.phone)}</a></div>`;

const setStatus = (cls, text) => { $status.className = "status " + cls; $status.textContent = text; };

(async () => {
  try {
    const res = await fetch(CONFIG.csvFile, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    FAQ = parseCSV(await res.text());
    FAQ.forEach(e => { e._kw = tokenSet([e.q, ...e.alts].join(" ")); e._ans = tokenSet(e.a); e._topic = tokenSet(e.topic); });
    renderAll();
  } catch (err) {
    setStatus("error", "Couldn’t load " + CONFIG.csvFile + ". Open this page from a web server (e.g. GitHub Pages), not by double-clicking it.");
    return;
  }

  setStatus("loading", "Loading smart search…");
  try {
    const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
    env.allowLocalModels = false;
    extractor = await pipeline("feature-extraction", CONFIG.model);
    const texts = [], owner = [];
    FAQ.forEach((e, i) => {
      [e.q, ...e.alts].forEach(t => { texts.push(t); owner.push([i, "q"]); });
      texts.push(e.a); owner.push([i, "a"]);
    });
    const vecs = [];
    for (let i = 0; i < texts.length; i += 32) vecs.push(...(await extractor(texts.slice(i, i + 32), { pooling:"mean", normalize:true })).tolist());
    FAQ.forEach(e => { e._vecs = []; e._ansVec = null; });
    vecs.forEach((v, j) => { const [i, kind] = owner[j]; if (kind === "q") FAQ[i]._vecs.push(v); else FAQ[i]._ansVec = v; });
    smart = true;
    setStatus("ready", "Smart search ready");
  } catch (err) {
    console.warn("Smart search unavailable, using keyword search:", err);
    setStatus("basic", "Basic search (smart search couldn’t load)");
  }
  if ($q.value.trim()) search($q.value);
})();
</script>
</body>
</html>
